<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Second Page</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .language-switch {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      background-color: #111;
      margin-top: 60px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    nav a:hover {
      background-color: yellow;
      color: black;
    }
  </style>
</head>
<body>

  <div class="language-switch">EN</div>

  <nav>
    <a id="nav-home" href="#">Home</a>
    <a id="nav-about" href="#">About Us</a>
    <a id="nav-faq" href="#">Faq</a>
    <a id="nav-contact" href="#">Contact us</a>
    <a id="nav-login" href="#">Login</a>
    <a id="nav-signup" href="#">Signup</a>
  </nav>

<script src="script.js"></script>
</body>
</html>
